allow-external-apps = true
shortcut.create-session = ctrl + alt + 2
shortcut.next-session = ctrl + alt + 3
shortcut.previous-session = ctrl + alt + 4

# Advanced 8-Key Grid with Popups (User Preferred Layout)
extra-keys = [ \
  [ \
    {key: 'ESC', popup: 'CTRL c'}, \
    {key: '|', popup: ';'}, \
    {key: '/', popup: '\\\\'}, \
    {key: '-', popup: '_'}, \
    {key: 'UP', popup: 'PGUP'}, \
    {key: '~', popup: '`'}, \
    {key: 'HOME', popup: 'ENTER'}, \
    {key: 'DEL', popup: 'BKSP'} \
  ], \
  [ \
    {key: 'TAB', popup: {macro: "CTRL d", display: 'EXIT'}}, \
    {key: 'CTRL', popup: 'ALT'}, \
    {key: 'ALT', popup: 'CTRL'}, \
    {key: 'LEFT', popup: 'HOME'}, \
    {key: 'DOWN', popup: 'PGDN'}, \
    {key: 'RIGHT', popup: 'END'}, \
    {key: 'END', popup: {macro: "CTRL l", display: 'CLR'}}, \
    {key: 'BKSP', popup: {macro: "CTRL l", display: 'CLR'}} \
  ] \
]
